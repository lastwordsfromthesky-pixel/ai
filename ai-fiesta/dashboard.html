<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fiesta 🎉 - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scroll to Top Button -->
  <button id="scroll-top-btn" class="scroll-top-btn">↑</button>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <div class="navbar-logo">AI Fiesta 🎉</div>
      <div class="navbar-user">
        <div class="user-avatar" id="user-avatar"></div>
        <div class="user-info">
          <div class="user-email" id="user-email"></div>
        </div>
        <button id="logout-btn" class="btn btn-outline">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-icon">🤖</span>
      <span class="stat-label">Models:</span>
      <span class="stat-value">10</span>
    </div>
    <div class="stat">
      <span class="stat-icon">🏢</span>
      <span class="stat-label">Providers:</span>
      <span class="stat-value">5</span>
    </div>
    <div class="stat">
      <span class="stat-icon">💬</span>
      <span class="stat-label">Messages:</span>
      <span class="stat-value" id="msg-count">0</span>
    </div>
    <div class="stat">
      <span class="stat-icon">🔑</span>
      <span class="stat-label">Keys Active:</span>
      <span class="stat-value" id="keys-count">0</span>
    </div>
  </div>

  <!-- Search & Filter -->
  <div class="search-filter">
    <div class="search-box">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search models..." 
        class="search-input"
      >
    </div>
    <div class="filter-pills">
      <button class="pill active" data-provider="all">All</button>
      <button class="pill" data-provider="openai">OpenAI</button>
      <button class="pill" data-provider="anthropic">Anthropic</button>
      <button class="pill" data-provider="google">Google</button>
      <button class="pill" data-provider="mistral">Mistral</button>
      <button class="pill" data-provider="cohere">Cohere</button>
    </div>
  </div>

  <!-- Models Grid -->
  <div class="models-grid" id="models-grid"></div>

  <!-- Settings Button -->
  <button id="settings-btn" class="settings-btn">⚙️</button>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content settings-modal">
      <div class="modal-header">
        <h2>API Keys Settings</h2>
        <button class="modal-close">✕</button>
      </div>
      <div class="settings-tabs">
        <button class="settings-tab active" data-tab="openai">OpenAI</button>
        <button class="settings-tab" data-tab="anthropic">Anthropic</button>
        <button class="settings-tab" data-tab="google">Google</button>
        <button class="settings-tab" data-tab="mistral">Mistral</button>
        <button class="settings-tab" data-tab="cohere">Cohere</button>
      </div>
      <div class="settings-content">
        <!-- OpenAI -->
        <div class="settings-tab-content active" data-tab="openai">
          <div class="key-input-group">
            <label>OpenAI API Key</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="key-openai" 
                class="form-input key-input" 
                placeholder="sk-..."
              >
              <button type="button" class="password-toggle" data-target="key-openai">👁️</button>
            </div>
            <div class="status-badge" id="status-openai">🔴 No Key</div>
            <button class="btn btn-gradient btn-sm" data-provider="openai">Save Key</button>
          </div>
        </div>

        <!-- Anthropic -->
        <div class="settings-tab-content" data-tab="anthropic">
          <div class="key-input-group">
            <label>Anthropic API Key</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="key-anthropic" 
                class="form-input key-input" 
                placeholder="sk-ant-..."
              >
              <button type="button" class="password-toggle" data-target="key-anthropic">👁️</button>
            </div>
            <div class="status-badge" id="status-anthropic">🔴 No Key</div>
            <button class="btn btn-gradient btn-sm" data-provider="anthropic">Save Key</button>
          </div>
        </div>

        <!-- Google -->
        <div class="settings-tab-content" data-tab="google">
          <div class="key-input-group">
            <label>Google Gemini API Key</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="key-gemini" 
                class="form-input key-input" 
                placeholder="AIza..."
              >
              <button type="button" class="password-toggle" data-target="key-gemini">👁️</button>
            </div>
            <div class="status-badge" id="status-google">🔴 No Key</div>
            <button class="btn btn-gradient btn-sm" data-provider="google">Save Key</button>
          </div>
        </div>

        <!-- Mistral -->
        <div class="settings-tab-content" data-tab="mistral">
          <div class="key-input-group">
            <label>Mistral API Key</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="key-mistral" 
                class="form-input key-input" 
                placeholder="mi-..."
              >
              <button type="button" class="password-toggle" data-target="key-mistral">👁️</button>
            </div>
            <div class="status-badge" id="status-mistral">🔴 No Key</div>
            <button class="btn btn-gradient btn-sm" data-provider="mistral">Save Key</button>
          </div>
        </div>

        <!-- Cohere -->
        <div class="settings-tab-content" data-tab="cohere">
          <div class="key-input-group">
            <label>Cohere API Key</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="key-cohere" 
                class="form-input key-input" 
                placeholder="co-..."
              >
              <button type="button" class="password-toggle" data-target="key-cohere">👁️</button>
            </div>
            <div class="status-badge" id="status-cohere">🔴 No Key</div>
            <button class="btn btn-gradient btn-sm" data-provider="cohere">Save Key</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Modal -->
  <div id="chat-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content chat-modal">
      <div class="modal-header">
        <div class="model-header-info">
          <div class="model-header-title" id="chat-model-name"></div>
          <div class="model-header-provider" id="chat-provider-name"></div>
        </div>
        <button class="modal-close">✕</button>
      </div>

      <div id="key-warning" class="key-warning hidden">
        ⚠️ Add your API key in ⚙️ Settings
      </div>

      <div class="chat-messages" id="chat-messages"></div>

      <div class="chat-input-area">
        <div class="char-counter">
          <span id="char-count">0</span>/1000
        </div>
        <textarea 
          id="chat-textarea" 
          class="chat-textarea" 
          placeholder="Type your message..." 
          rows="1"
        ></textarea>
        <div class="chat-actions">
          <button id="chat-clear" class="chat-action-btn">🗑️</button>
          <button id="chat-send" class="chat-action-btn send">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
